<style>
:root{--bg:#0b0b14;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.12);--tx:#f4f4fb;--mut:#9a9ab5;--a:#8b7cff;--b:#35e0c2;--r:#ff6b8b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f1f0fa;--card:rgba(255,255,255,.8);--bd:rgba(0,0,0,.09);--tx:#1a1a2e;--mut:#6b6b85;--b:#0fa88f;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
.bl{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.b1{background:var(--a);top:-25vmax;left:-25vmax}.b2{background:var(--b);bottom:-30vmax;right:-25vmax;animation-delay:-7s}
@keyframes fl{to{transform:translate(14vmax,9vmax) scale(1.25)}}
#app{max-width:520px;margin:auto;padding:10px 16px calc(100px + env(safe-area-inset-bottom,0px))}
h2{font-size:34px;margin:8px 0 14px;letter-spacing:-.03em;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:15px;margin:0 0 11px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#v.go>*{animation:rise .6s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.hero{background:linear-gradient(135deg,rgba(139,124,255,.35),rgba(53,224,194,.25));padding:20px}
.big{font-size:42px;font-weight:800;letter-spacing:-.03em;margin:2px 0 8px}
small,.mut{color:var(--mut)}
.g{color:var(--b)}.rd{color:var(--r)}
input,select{width:100%;padding:13px;border-radius:14px;border:1px solid var(--bd);background:rgba(127,127,160,.14);color:var(--tx);font-family:inherit;font-size:16px;outline:none;min-width:0}
input:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(139,124,255,.3)}
input+input,select+input{margin-top:8px}
.btn{background:linear-gradient(135deg,var(--a),#5ad1ff);color:#fff;border:0;border-radius:14px;padding:13px 18px;font-family:inherit;font-weight:600;font-size:16px;transition:transform .15s}
.btn:active,.pill:active,.x:active{transform:scale(.9)}
.pill{background:rgba(139,124,255,.22);color:var(--tx);border:0;border-radius:99px;padding:8px 13px;font-family:inherit;font-weight:600;font-size:14px;white-space:nowrap;transition:transform .15s}
.x{background:none;border:0;color:var(--mut);font-size:18px;padding:6px}
.dn{opacity:.55}
.chk .bx{width:30px;height:30px;flex:none;fill:none;stroke:var(--mut);stroke-width:2}
.chk .bx path{stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s .1s}
.chk .bx rect{fill:transparent;transition:.3s}
.chk.on .bx rect{fill:var(--b);stroke:var(--b);animation:pp .4s}
.chk.on .bx path{stroke-dashoffset:0}
.chk.on span{text-decoration:line-through;color:var(--mut)}
.chk span{transition:color .3s}
@keyframes pp{50%{transform:scale(1.3)}}
.rw{position:relative;width:130px;height:130px;margin:auto}
.rw svg{transform:rotate(-90deg)}
.rw circle{fill:none;stroke-width:11;stroke-linecap:round}
.rw .t{stroke:rgba(127,127,160,.2)}
.rw .rg{stroke:url(#gr);stroke-dasharray:314;transition:stroke-dashoffset 1s cubic-bezier(.3,1,.4,1)}
.rw div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:26px;font-weight:800;line-height:1}
.rw small{font-size:12px;font-weight:400}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:linear-gradient(to top,var(--a) calc(var(--f)*100%),rgba(127,127,160,.2) 0);margin:auto}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px}
.bars div{flex:1;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.bars i{display:block;border-radius:8px;background:linear-gradient(var(--b),var(--a));height:var(--h);min-height:3px;animation:gw .9s cubic-bezier(.3,1,.4,1) both}
@keyframes gw{from{height:0}}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;overflow-x:auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--bd);scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{flex:1 0 62px;background:none;border:0;color:var(--mut);font-family:inherit;font-weight:600;font-size:11px;padding:4px 0}
#nav b{display:block;font-size:23px;transition:transform .35s cubic-bezier(.3,1.8,.5,1);filter:grayscale(1);opacity:.7}
#nav .on{color:var(--tx)}#nav .on b{transform:translateY(-5px) scale(1.25);filter:none;opacity:1}
.cf{position:fixed;width:9px;height:9px;border-radius:2px;z-index:99;animation:pop 1.2s ease-out forwards;pointer-events:none}
@keyframes pop{40%{transform:translate(var(--x),var(--y))}to{transform:translate(var(--x),420px) rotate(720deg);opacity:0}}
#hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
#nm{display:grid;place-items:center;cursor:pointer;min-height:56px;user-select:none;-webkit-user-select:none}
#nm>*{grid-area:1/1}
.ls{display:flex;white-space:pre}
.ls i{font-weight:800;font-size:32px;line-height:1;font-style:normal;display:inline-block;color:var(--tx);text-shadow:0 0 16px var(--a),0 0 34px var(--a);transition:transform .65s cubic-bezier(.5,-.4,.3,1.3),opacity .5s;transition-delay:calc(.25s + var(--i)*40ms)}
.up .ls i{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(0);opacity:0;transition-delay:calc(var(--i)*40ms)}
.tb{font-size:40px;transform:scale(0) rotate(-70deg);opacity:0;transition:transform .45s,opacity .25s}
.up .tb{transform:none;opacity:1;transition:transform .7s cubic-bezier(.3,2,.5,1) .3s,opacity .3s .3s}
.gear{background:var(--card);border:1px solid var(--bd);color:var(--tx);width:46px;height:46px;border-radius:50%;font-size:21px;transition:transform .5s}.gear:active{transform:rotate(120deg) scale(.88)}
#sh{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s}
#sh.o{opacity:1;pointer-events:auto}
#sh>div{width:100%;max-width:520px;margin:auto;background:var(--bg);border:1px solid var(--bd);border-radius:28px 28px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.9,.3,1.1)}
#sh.o>div{transform:none}
#sh label small{display:block;margin:12px 0 4px}
#ts{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:60;max-width:496px;margin:auto;transform:translateY(-220%);transition:transform .5s cubic-bezier(.3,1.5,.5,1)}#ts.o{transform:none}
.cups{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cup{position:relative;aspect-ratio:3/4;clip-path:polygon(6% 0,94% 0,82% 100%,18% 100%);background:rgba(127,127,160,.2);border:0;padding:0;overflow:hidden;transition:transform .2s}
.cup:active{transform:scale(.9)}
.lv{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#58c8ff,#2b6cff);transition:height 1.4s cubic-bezier(.3,.9,.3,1)}
.cup.f .lv{height:92%}
.lv::before{content:"";position:absolute;left:-50%;top:-12px;width:200%;height:24px;border-radius:45%;background:#8be6ff;opacity:.75;animation:wv 2.4s ease-in-out infinite alternate}
@keyframes wv{from{transform:translateX(-12%)}to{transform:translateX(12%)}}
.cup span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mut);z-index:2;transition:color .5s}.cup.f span{color:#fff}
.due,.card.hot,.rad.hot{position:relative;border-color:var(--r)}
.due::after,.card.hot::after,.rad.hot::after{content:"";position:absolute;inset:-1px;border-radius:22px;box-shadow:0 0 26px var(--r);pointer-events:none;animation:g2 1.1s ease-in-out infinite alternate}
@keyframes g2{from{opacity:.15}to{opacity:1}}
@keyframes gl{to{box-shadow:0 0 22px var(--r)}}
.stp{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.stp b.n{font-size:32px;letter-spacing:-.02em;cursor:pointer}
.stp button{width:74px;height:74px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:38px;font-weight:300;transition:transform .15s,background .2s}
.stp button:active{transform:scale(.84);background:var(--a)}
.hr{transition:stroke-dashoffset 1.5s cubic-bezier(.3,1,.4,1);filter:drop-shadow(0 0 7px currentColor)}
.rad{position:relative;height:166px;overflow:hidden;border-radius:22px;border:1px solid var(--bd);background:var(--card);margin-bottom:11px}
.rad::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(53,224,194,.2),transparent);animation:sw 4s linear infinite;pointer-events:none}
@keyframes sw{from{left:-30%}to{left:100%}}
.today{position:absolute;left:14%;top:0;bottom:0;width:2px;background:var(--b);box-shadow:0 0 14px var(--b);z-index:1}
.today small{position:absolute;top:6px;left:7px;color:var(--b);font-size:11px}
.tk{position:absolute;bottom:6px;font-size:10px;transform:translateX(-50%)}
.bi{position:absolute;padding:7px 11px;border-radius:14px;font-size:12px;white-space:nowrap;background:rgba(139,124,255,.3);border:1px solid var(--a);transition:left 1.4s cubic-bezier(.3,1,.4,1);z-index:2}
.bi.warm{background:rgba(255,190,70,.3);border-color:#ffbe46}
.bi.hot{background:rgba(255,61,90,.4);border-color:var(--r);animation:gl .9s ease-in-out infinite alternate}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:11px;border-radius:12px;font-family:inherit;font-weight:600;font-size:15px;transition:.3s}
.seg .on{background:linear-gradient(135deg,var(--a),#5ad1ff);color:#fff}
.pb{height:5px;border-radius:9px;background:rgba(127,127,160,.2);margin-top:10px;overflow:hidden}
.pf{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width 1s linear}
@keyframes dn{from{opacity:0;transform:translateY(-46px) scale(.96)}}
.pin>*{animation:dn .7s cubic-bezier(.2,.9,.3,1.2) both}
.tank{position:relative;width:210px;height:210px;margin:4px auto;border-radius:50%;overflow:hidden;border:2px solid rgba(88,200,255,.5);box-shadow:0 0 40px rgba(43,108,255,.35),inset 0 0 30px rgba(88,200,255,.2);background:rgba(127,127,160,.12)}
.tw{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p)*100%);background:linear-gradient(#58c8ff,#2b6cff);transition:height 1.5s cubic-bezier(.3,.9,.3,1)}
.tw::before{content:'';position:absolute;left:-50%;top:-14px;width:200%;height:28px;border-radius:45%;background:#8be6ff;opacity:.75;animation:wv 2.4s ease-in-out infinite alternate}
.tt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:2;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45)}.tt b{font-size:46px;letter-spacing:-.03em}.tt small{color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.tl{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:3px;text-align:left;color:var(--tx);font-family:inherit;font-size:14px;transition:transform .2s}
.tl:active{transform:scale(.95)}.tl b{font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chs{display:flex;gap:5px;flex-wrap:wrap}
.ch{border:1px solid var(--bd);background:none;color:var(--mut);border-radius:99px;padding:6px 11px;font-family:inherit;font-weight:600;font-size:13px}.ch.on{background:var(--a);color:#fff;border-color:var(--a)}
.hi h1{font-size:42px;line-height:1.05;margin:6px 0 16px;letter-spacing:-.03em}
.hi h1 span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal i{display:block}
.cd{position:relative;aspect-ratio:1;border:1px solid var(--bd);background:none;color:var(--tx);border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;transition:transform .2s,background .3s}
.cd:active{transform:scale(.86)}.cd.td{border-color:var(--b)}.cd.sel{background:var(--a);color:#fff;border-color:var(--a)}
.cd u{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--b)}.cd u.pn{background:#ffbe46}
:root{--g:linear-gradient(135deg,var(--a),#5ad1ff);--hg:linear-gradient(90deg,var(--a),var(--b));--bt:#fff}
h2,.hi h1 span{background-image:var(--hg)}
.btn,.seg .on{background-image:var(--g);color:var(--bt)}
.cd.sel,.ch.on{color:var(--bt)}
#gr stop:first-child{stop-color:var(--a)}#gr stop:last-child{stop-color:var(--b)}
.pill.ok{background:rgba(53,224,194,.25);color:var(--b)}
.bi.ok{background:rgba(53,224,194,.18);border-color:var(--b);opacity:.7}
.th{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.th button{display:flex;align-items:center;gap:10px;padding:11px;border-radius:16px;color:var(--tx);background:var(--card);border:1px solid var(--bd);font-family:inherit;font-weight:600;font-size:14px;text-align:left;transition:transform .2s}
.th button:active{transform:scale(.94)}.th .on{border-color:var(--a);box-shadow:0 0 0 2px var(--a)}
.sw{display:block;width:28px;height:28px;border-radius:50%;flex:none;border:1px solid var(--bd)}
#fx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#fx i{position:absolute;top:0;font-style:normal;animation:fall linear infinite;will-change:transform}
@keyframes fall{from{transform:translate3d(0,-12vh,0) rotate(0)}50%{transform:translate3d(24px,55vh,0) rotate(200deg)}to{transform:translate3d(-16px,112vh,0) rotate(420deg)}}

@keyframes shine{to{background-position:200% 0}}

@keyframes bob{to{transform:translateY(-5px)}}

@keyframes jelly{0%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.1,.92)}72%{transform:scale(.96,1.04)}100%{transform:none}}
#rs{position:fixed;inset:0;z-index:100;overflow:hidden;background:rgba(40,0,20,0);transition:background 1.6s,opacity .6s}

</style></head>
<body>
<div class="bl b1"></div><div class="bl b2"></div><div id="fx"></div>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="gr"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#35e0c2"/></linearGradient></defs></svg>
<div id="app"><div id="hd"></div><div id="v"></div></div><div id="sh" onclick="event.target==this&&ST(0)"></div><div id="ts"></div>
<div id="nav"></div>
<script>
const $=s=>document.querySelector(s);
let S={};try{S=JSON.parse(localStorage.getItem('S'))||{}}catch(e){}
S={tx:[],owe:[],tasks:['Drink 2L water','Read 10 pages'],done:{},pr:{},food:{},learn:{},study:{},walk:{},w:60,name:'ABDUU',wt:{},wh:2,hk:{},gs:10000,ge:500,bills:[],...S};
const save=()=>{try{localStorage.setItem('S',JSON.stringify(S))}catch(e){}};
const off=new Date().getTimezoneOffset()*6e4,dstr=k=>new Date(Date.now()-off-k*864e5).toISOString().slice(0,10),td=()=>dstr(0);
let tab='money',day=td(),mon=td().slice(0,7),c=0;
const uid=()=>Date.now()*100+(c++%100);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const sum=a=>a.reduce((s,x)=>s+x.a,0);
const N=(n,p='')=>`<span data-n="${Math.round(n)}" data-p="${p}">0</span>`;
const dp=()=>`<div class=card><input type=date value="${day}" onchange="day=this.value||day;R()"></div>`;
const ring=(p,t,s)=>`<div class=rw><svg width=130 height=130 viewBox="0 0 130 130"><circle class=t cx=65 cy=65 r=50></circle><circle class=rg data-p="${p}" style="stroke-dashoffset:314" cx=65 cy=65 r=50></circle></svg><div><span>${t}<br><small>${s}</small></span></div></div>`;
const chk=(on,l,fn,rm)=>`<div class="card row chk ${on?'on':''}"><div class=row style="flex:1;justify-content:flex-start" onclick="${fn}"><svg class=bx viewBox="0 0 24 24"><rect x=2 y=2 width=20 height=20 rx=7></rect><path d="M7 12.5l3.5 3.5 6.5-7.5"></path></svg><span>${l}</span></div>${rm?`<button class=x onclick="${rm}">✕</button>`:''}</div>`;
function boom(){for(let i=0;i<44;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:50%;top:38%;background:hsl(${Math.random()*360},90%,60%);--x:${(Math.random()-.5)*380}px;--y:${-Math.random()*280-40}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),1300)}}

/* food brain: built-in list (kcal per 1 serving), then what you teach it */
const DB={};"rotti|roti|chapati:150,pol rotti|coconut roti:180,kottu|koththu:700,rice:200,string hopper|idiyappa:25,hopper|appa:120,egg hopper:190,pol sambol:60,dhal|dal|parippu:180,chicken curry:250,fish curry:150,egg curry:140,vegetable curry:90,cutlet|fish cutlet:130,samaposha|samahan porridge:150,pizza:285,burger:450,fries|chips:365,egg|boiled egg:78,fried egg:95,omelette:150,bread:80,banana:105,apple:95,orange:62,mango:200,tea|plain tea:5,milk tea:80,coffee:60,biscuit:50,noodles:380,biriyani|biryani:600,fried rice:550,pasta:400,chicken:165,roll|egg roll:200,patty|pastry:250,milo:120,coke|soft drink|pepsi:140,ice cream:140,chocolate:230,watalappan:250,kiribath:250,yogurt|curd:100,dosa:170,idli:60,sandwich:300,sausage:150,sweet|laddu:180,juice:110,milk:120,oats:150,soup:90".split(',').forEach(x=>{const[k,v]=x.split(':');k.split('|').forEach(n=>DB[n]=+v)});
function look(n){n=n.toLowerCase();const c=[n,n.replace(/s$/,''),n.replace(/es$/,'')];for(const m of[S.learn,DB])for(const x of c)if(m[x]!=null)return m[x];for(const m of[S.learn,DB])for(const k in m)if(k.length>2&&n.includes(k))return m[k];return null}
function addFood(){let v=$('#fi').value;if(!v.trim())return;const kv=+$('#fk').value;if(kv){if(/,|\+|\band\b/i.test(v))return toast('Add one food at a time to set its kcal.');const qm=v.trim().match(/^(\d+(\.\d+)?)/);v+=' '+Math.round(kv/(qm?+qm[1]:1))+'kcal'}const L=S.food[day]=S.food[day]||[];
v.split(/,|\+|\n|\band\b/i).forEach(p=>{p=p.trim();if(!p)return;let k=null,m=p.match(/(\d+)\s*k?cal/i),src;if(m){k=+m[1];p=p.replace(m[0],'')}let q=1;m=p.match(/^(\d+(\.\d+)?)\s*x?\s*/i);if(m){q=+m[1];p=p.slice(m[0].length)}
const n=p.replace(/\b(pieces?|plates?|cups?|slices?|bowls?|of|an?)\b/gi,'').replace(/\s+/g,' ').trim();if(!n)return;
if(k==null){k=look(n);src=k==null?'?':S.learn[n.toLowerCase()]!=null?'learned':'db'}else{src='you';S.learn[n.toLowerCase()]=k}
L.push({id:uid(),n,q,k,src})});save();R()}
function fix(id){const x=S.food[day].find(y=>y.id==id),v=prompt(`Calories in ONE ${x.n}?`,x.k??'');if(v!==null&&v.trim()!==''&&!isNaN(+v)){x.k=+v;x.src='learned';S.learn[x.n.toLowerCase()]=+v;save();R()}}

const V={};
V.money=()=>{const L=S.tx.filter(t=>t.d.startsWith(mon)).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id),i=sum(L.filter(t=>t.t=='in')),o=sum(L.filter(t=>t.t=='out'));
return `<h2>Money</h2><div class=card><input type=month value="${mon}" onchange="mon=this.value||mon;R()"></div>
<div class="card hero"><small>Balance for ${mon}</small><div class=big>${N(i-o,'Rs ')}</div><div class=row><span class=g>▲ ${N(i,'Rs ')} received</span><span class=rd>▼ ${N(o,'Rs ')} spent</span></div></div>
<div class=card><div class=row><select id=mt><option value=out>Spent</option><option value=in>Received</option></select><input id=ma type=number inputmode=decimal placeholder="Amount" style="margin:0"></div><input id=mn placeholder="For what?"><input id=md type=date value="${td()}"><button class=btn style="width:100%;margin-top:10px" onclick=addTx()>Add</button></div>
${L.map(t=>`<div class="card row"><div><b>${esc(t.n)}</b><br><small>${t.d}</small></div><div class=row><b class="${t.t=='in'?'g':'rd'}">${t.t=='in'?'+':'−'}${t.a.toLocaleString()}</b><button class=x onclick="del('tx',${t.id})">✕</button></div></div>`).join('')||'<p class=mut>Nothing this month yet. Add your first entry above.</p>'}`};
function addTx(){const a=+$('#ma').value;if(!a)return;const d=$('#md').value||td();S.tx.push({id:uid(),t:$('#mt').value,a,n:$('#mn').value||'—',d});mon=d.slice(0,7);save();R()}
const del=(k,id)=>{S[k]=S[k].filter(x=>x.id!=id);save();R()};

V.owe=()=>`<h2>I owe</h2><div class="card hero"><small>Still to pay back</small><div class=big>${N(sum(S.owe.filter(x=>!x.p)),'Rs ')}</div></div>
<div class=card><input id=on placeholder="Who?"><input id=oa type=number inputmode=decimal placeholder="Amount"><input id=ow placeholder="For what?"><button class=btn style="width:100%;margin-top:10px" onclick=addOwe()>Add</button></div>
${S.owe.map(x=>`<div class="card row ${x.p?'dn':''}"><div><b>${esc(x.n)}</b> · Rs ${x.a.toLocaleString()}<br><small>${esc(x.w)}</small></div><div class=row><button class=pill onclick="payOwe(${x.id})">${x.p?'Paid ✓':'Mark paid'}</button><button class=x onclick="del('owe',${x.id})">✕</button></div></div>`).join('')||'<p class=mut>You owe nobody. Add a debt above if that changes.</p>'}`;
function addOwe(){const a=+$('#oa').value,n=$('#on').value.trim();if(!a||!n)return;S.owe.push({id:uid(),n,a,w:$('#ow').value||'—',p:0});save();R()}
function payOwe(id){const x=S.owe.find(y=>y.id==id);x.p=!x.p;save();R()}

V.daily=()=>{const d=S.done[day]||[],T=S.tasks,k=T.filter(t=>d.includes(t)).length;
return `<h2>Daily tasks</h2>${dp()}<div class=card>${ring(T.length?k/T.length:0,k+'/'+T.length,'done')}</div>${T.map((t,i)=>chk(d.includes(t),esc(t),`tg(${i})`,`rt(${i})`)).join('')}<div class="card row"><input id=nt placeholder="New daily task"><button class=btn onclick=addT()>Add</button></div>`};
function tg(i){const t=S.tasks[i],d=S.done[day]=S.done[day]||[],j=d.indexOf(t);j<0?d.push(t):d.splice(j,1);save();R();if(S.tasks.every(x=>d.includes(x)))boom()}
function addT(){const v=$('#nt').value.trim();if(v){S.tasks.push(v);save();R()}}
function rt(i){S.tasks.splice(i,1);save();R()}

const P=['Fajr','Dhuhr','Asr','Maghrib','Isha'];
V.prayer=()=>{const d=S.pr[day]||[];
return `<h2>Prayers</h2>${dp()}<div class=card>${ring(d.length/5,d.length+'/5','prayed')}</div>${P.map(p=>chk(d.includes(p),p,`tp('${p}')`)).join('')}
<div class="card"><small>Last 7 days</small><div class=row style="margin-top:10px">${[6,5,4,3,2,1,0].map(k=>{const s=dstr(k),n=(S.pr[s]||[]).length;return `<div style="text-align:center"><div class=dot style="--f:${n/5}">${n}</div><small>${s.slice(8)}</small></div>`}).join('')}</div></div>`};
function tp(p){const d=S.pr[day]=S.pr[day]||[],j=d.indexOf(p);j<0?d.push(p):d.splice(j,1);save();R();if(d.length==5)boom()}

V.food=()=>{const L=S.food[day]||[],e=L.reduce((s,x)=>s+(x.k||0)*x.q,0),b=(S.hk[day]||{}).e??Math.round((S.walk[day]||0)*S.w*.65);
const bd={db:'from my food list',learned:'🧠 learned from you',you:'🧠 saved from you','?':'unknown. Tap to teach me'};
return `<h2>Food</h2>${dp()}<div class=card>${ring(Math.min(1,e/2000),N(e),'kcal eaten')}<p class=row style="justify-content:center;margin:12px 0 0"><small>Burned ${b}</small><small>Net ${Math.round(e-b)}</small></p></div>
<div class=card><input id=fi placeholder="What did you eat? e.g. 2 rotti" onkeydown="event.key=='Enter'&&addFood()"><input id=fk type=number inputmode=numeric placeholder="kcal (optional, one food only)"><button class=btn style="width:100%;margin-top:10px" onclick=addFood()>Calculate and save</button><small style="display:block;margin-top:8px">Know the number? Type it: “kottu 650kcal”. I’ll remember it next time.</small></div>
${L.map(x=>`<div class="card row"><div><b>${x.q}× ${esc(x.n)}</b><br><small>${bd[x.src]||''}</small></div><div class=row><button class=pill onclick="fix(${x.id})">${x.k==null?'set kcal':Math.round(x.k*x.q)+' kcal'}</button><button class=x onclick="delF(${x.id})">✕</button></div></div>`).join('')}`};
function delF(id){S.food[day]=S.food[day].filter(x=>x.id!=id);save();R()}

V.study=()=>{const L=S.study[day]||[];
return `<h2>Study plan</h2>${dp()}${L.map((x,i)=>chk(x.d,esc(x.t),`ts(${i})`,`rs(${i})`)).join('')||'<p class=mut>No tasks for this day. Plan one below.</p>'}<div class="card row"><input id=st placeholder="e.g. Chemistry past paper" onkeydown="event.key=='Enter'&&addS()"><button class=btn onclick=addS()>Add</button></div>`};
function addS(){const v=$('#st').value.trim();if(v){(S.study[day]=S.study[day]||[]).push({t:v,d:0});save();R()}}
function ts(i){S.study[day][i].d^=1;save();R()}
function rs(i){S.study[day].splice(i,1);save();R()}

V.walk=()=>{const km=S.walk[day]||0;
return `<h2>Walking</h2>${dp()}<div class="card hero"><small>Calories burned</small><div class=big>${N(km*S.w*.65)}</div><small>${km} km at ${S.w} kg</small></div>
<div class=card><input id=wk type=number step=.1 inputmode=decimal placeholder="Kilometres walked" value="${km||''}"><button class=btn style="width:100%;margin-top:10px" onclick=setW()>Save distance</button></div>
<div class=card><small>Your weight (kg)</small><input type=number inputmode=decimal value="${S.w}" onchange="S.w=+this.value||60;save();R()"></div>
<div class=card><small>Last 7 days</small><div class=bars style="margin-top:10px">${[6,5,4,3,2,1,0].map(k=>{const s=dstr(k),m=S.walk[s]||0;return `<div><i style="--h:${Math.min(100,m*10)}%"></i><small>${s.slice(8)}</small></div>`}).join('')}</div></div>`};
